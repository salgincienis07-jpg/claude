<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEXMIRA Tablet</title>
<link rel="stylesheet" href="ipad.css">
<script>window.VXITEMS = window.VXITEMS || null;</script>
<script src="items.js"></script>
</head>
<body>
<div id="device" class="device">
  <div class="dev-cam"></div>
  <div class="dev-btn dev-pwr" data-act="lock" title="Lock"></div>
  <div class="dev-btn dev-vol1"></div>
  <div class="dev-btn dev-vol2"></div>
  <div id="screen" class="screen">
    <div id="wall" class="wall"></div>
    <div class="fog"><i class="f1"></i><i class="f2"></i><i class="f3"></i></div>
    <div class="noise"></div>
    <div id="home" class="home"></div>
    <div id="app" class="app">
      <div class="app-hdr">
        <button class="back" data-act="home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="backTxt">Ana Ekran</span></button>
        <div class="app-title"><span id="appIco" class="app-ico-s"></span><span id="appTitle"></span></div>
        <div id="appRight" class="app-right"></div>
      </div>
      <div id="appBody" class="app-body"></div>
    </div>
    <div id="lock" class="lock"></div>
    <div id="status" class="status"></div>
    <div id="banners" class="banners"></div>
    <div id="toast" class="toast"></div>
    <canvas id="fx" class="fx"></canvas>
    <div class="homebar" data-act="home"><i></i></div>
  </div>
</div>
<noscript><div class="nojs">JavaScript gerekli / JavaScript required</div></noscript>
<script src="ipad.js"></script>
</body>
</html>
