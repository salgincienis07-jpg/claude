<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEXMIRA iPad</title>
<script src="t06base.css.js?v=105"></script>
<script src="t06items.js?v=105"></script>
<script src="t06layout.css.js?v=105"></script>
<script src="t06ios.css.js?v=105"></script>
</head>
<body>
<div id="device" class="device">
  <div class="dev-cam"></div>
  <div id="screen" class="screen">
    <div id="wall" class="wall"></div>
    <div class="fog"><i class="f1"></i><i class="f2"></i></div>
    <div class="vignette"></div>
    <div id="status" class="status">
      <span id="stTime">--:--</span>
      <span class="st-mid">VEXMIRA<em id="stCredit">by smurfsexy</em></span>
      <span class="st-right"><i class="wifi"></i><b id="stOnline"></b><i class="batt"><i></i></i></span>
    </div>
    <div id="lock" class="lock">
      <div class="lock-in"><div class="lock-c">
      <div class="lock-pad"><i class="lock-shackle"></i><i class="lock-body"></i></div>
      <div id="lockDate" class="lock-date"></div>
      <div id="lockTime" class="lock-time">--:--</div>
      <div class="lock-brand"><div id="lockLogo" class="lock-logo"></div><span>VEXMIRA</span></div>
      <div id="lockNote" class="lock-note"></div>
      </div></div>
      <div id="lockHint" class="lock-hint"></div>
      <div class="lock-credit">Tablet &amp; Mod: <b>smurfsexy</b></div><i class="lock-btn l"></i><i class="lock-btn r"></i>
    </div>
    <div id="home" class="home"></div>
    <div id="app" class="app">
      <div class="app-hdr">
        <button id="backBtn" class="back"><span class="chev"></span><span id="backTxt"></span></button>
        <div class="app-title"><span id="appIco" class="app-ico-s"></span><span id="appTitle"></span></div>
        <div id="appRight" class="app-right"></div>
      </div>
      <div id="appBody" class="app-body"></div>
    </div>
    <div id="banners" class="banners"></div>
    <div id="homebar" class="homebar"></div>
    <div id="demo" class="demo-badge"></div>
    <canvas id="fx" class="fx"></canvas>
  </div>
</div>
<script src="t06ui.js?v=105"></script>
</body>
</html>
