//    modeline duser (oyuncu "failed to transmit" hatasi almaz).
//  - Bir sesi KAPATMAK icin:  vex_res ANAHTAR ""
//  - DONGULU wav (icinde loop / cue noktasi olan) kullanma; kullanirsan plugin
//    onu otomatik durdurur (vex_sound_loopguard).
//  - Ozel dosyalari FastDL'e de yukle (sv_downloadurl). Degisiklikten sonra
//    HARITA DEGISTIR.
//  - Varsayilanlar: Vexmira'nin kendi ozel sesleri (cstrike/sound/vexmira/).
//    Bu klasor yoksa her ses otomatik olarak orijinal HL / CS sesine duser.

// =====================================================================
//  KENDI MODELINI EKLEME REHBERI
// =====================================================================
//  Genel adimlar:
//   1) Dosyayi sunucuya koy (yollar cstrike/ klasorune gore yazilir).
//   2) Bu dosyadaki ilgili "vex_res ANAHTAR" satirini kendi dosyanla degistir
//      (satir yoksa ya da // ile kapaliysa yeni satir olarak ekle).
//   3) Ayni dosyayi ayni yolla FastDL'e (sv_downloadurl) yukle, sonra HARITA DEGISTIR.
//   4) Dosya yoksa / adi yanlissa plugin COKMEZ: log'a "Model bulunamadi" yazar ve asagida
//      yazan YEDEGE duser. Ozel modeli kapatip yedegi kullanmak icin: vex_res ANAHTAR ""
//   5) Model + sprite sayisi MODEL_BUDGET'i asarsa once p_ silah modelleri elenir.
//
//  A) OYUNCU MODELLERI - sadece ISIM yazilir (yol / .mdl yazilmaz)
//     Dosya: models/player/<ad>/<ad>.mdl  (dokular ayriysa <ad>T.mdl de ayni klasore;
//     plugin onu da indirtir).  Ornek: vex_res Z0_MODEL "benim_zombim"
//       Zombi siniflari ...... Z<n>_MODEL      n = 0-23 ("ZOMBI SINIFLARI" listesi)
//       Bosslar .............. B<n>_MODEL      n = 0-8  ("BOSSLAR" listesi)
//       Nemesis / Assassin ... NEMESIS_MODEL / ASSASSIN_MODEL
//       Survivor / Sniper .... SURVIVOR_MODEL / SNIPER_MODEL
//       VIP / Admin .......... VIP_MODEL / ADMIN_MODEL  (admin = ADMIN_BAN yetkisi)
//       Insanlar (CT) ........ HUMAN_MODELS "ad1 ad2 ad3"  (oyuncu basina rastgele, round boyu sabit)
//                              HUMAN_MODEL "ad"  listeye bir model daha ekler
//     Yedek: zombi / boss / nemesis / assassin -> orijinal T modeli (satirdaki "yedek:");
//     insan / survivor / sniper / VIP / admin -> orijinal CT modeli. Yardimci zombiler Z0_MODEL.
//
//  B) ZOMBI ELLERI (pence, v_ modeli) - tam yol. v_knife.mdl ile ayni animasyon sirasi olmali.
//       Sinifa ozel .......... Z<n>_CLAW     "models/vexmira/claws/v_pencem.mdl"
//       Bossa ozel ........... B<n>_CLAW
//       Nemesis / Assassin ... NEMESIS_CLAW / ASSASSIN_CLAW
//       Genel yedek .......... CLAW_MODEL    (yardimci zombiler de bunu kullanir)
//     Secim sirasi: boss > nemesis / assassin > sinif > CLAW_MODEL > oyunun normal bicagi.
//     Pence modeli secildiyse zombinin elde gorunen (p_) bicagi gizlenir.
//
//  C) INSAN ELLERI / BICAK / SILAHLAR - tam yol
//       V_<SILAH> = el (v_) modeli, P_<SILAH> = elde gorunen (p_) modeli
//       Bicak: V_KNIFE / P_KNIFE   Silah adlari: "SILAH MODELLERI" bolumu (AK47, M4A1, AWP ...)
//     Animasyon sirasi oyunun orijinal v_ modeliyle ayni olmali. Yedek: oyunun kendi modeli.
//
//  D) BOMBALAR (insan) - tam yol
//       El ........ V_HEGRENADE (ates) / V_SMOKEGRENADE (buz) / V_FLASHBANG (isaret fisegi)
//       Elde ...... P_HEGRENADE / P_SMOKEGRENADE / P_FLASHBANG
//       Firlatilan  W_HEGRENADE / W_SMOKEGRENADE / W_FLASHBANG
//     Yedek: oyunun kendi bomba modelleri. Zombinin enfeksiyon bombasi orijinal modelde kalir.
//
//  E) OZEL SILAHLAR - SW<n>_VMODEL (el) / SW<n>_PMODEL (elde), n = 0-7 ("SILAH MODELLERI").
//     Yedek: dayandigi normal silahin orijinal modeli (or. Plazma -> M4A1).
//
//  F) DUNYA MODELLERI - tam yol
//       LASERMINE_MODEL (+ LASERMINE_BODY / _SEQUENCE / _SKIN)  yedek: v_tripmine, yoksa w_c4
//       AIRDROP_MODEL   ikmal kutusu        yedek: w_weaponbox
//       EGG_MODEL       Hive Queen yumurtasi  yedek: parlayan kure
//       HOOK_MODEL      kasap kancasi (+X kanca ucu)  yedek: parlayan kure
//       SPORE_MODEL     spor kesesi         yedek: SPR_SPORE sprite'i
//
//  G) SPRITE'LAR (.spr, tam yol): yoksa o efekt oyunun kendi sprite'iyla cizilir ya da kapanir.
//     Oyuncuya bagli kafa isaretleri (BOSS_MARK_SPRITE) ALPHATEST bicimli olmali.

