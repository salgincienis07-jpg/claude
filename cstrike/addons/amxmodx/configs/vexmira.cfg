// =====================================================================
//  VEXMIRA ZOMBIE CORE v1.4 - Plugin ayarlari
//  Konum: cstrike/addons/amxmodx/configs/vexmira.cfg  (plugin otomatik yukler)
//  Ses / model / gokyuzu ayarlari: vexmira_resources.ini
// =====================================================================

// ---------------------------------------------------------------------
//  HARITA PLANI (30 ROUND)
// ---------------------------------------------------------------------
mp_maxrounds           30            // harita 30 round surer, sonra harita degisir
mp_timelimit           0             // sure siniri yok (30 round belirler)
vex_rounds_total       30            // mp_maxrounds 0 yapilirsa plan 30 roundda bir basa doner
vex_boss_rounds        "7 15 23 30"  // BOSS roundlari (son round = FINAL BOSS)
vex_special_rounds     "4 11 19 26"  // ozel mod roundlari (Nemesis, Survivor, Plague...)
vex_multi_chance       15            // normal roundun Coklu Enfeksiyon olma olasiligi (%)
vex_event_chance       85            // normal roundlarda event olasiligi (%) - 1. round her zaman sakin
vex_countdown          15            // enfeksiyondan once geri sayim (sn)
vex_zombie_respawn     4.0           // olen zombinin geri donus suresi (sn), sadece Infection/Multi
// Not: vex_boss_rounds bos ("") birakilirsa vex_boss_every kullanilir
vex_boss_every         6

// ---------------------------------------------------------------------
//  CANLAR
// ---------------------------------------------------------------------
vex_first_zombie_hp    4500          // ilk zombi (sinif carpani uygulanir)
vex_zombie_hp          1800          // enfekte olan zombi (sinif carpani uygulanir)
vex_human_hp           100           // insan taban cani (+ perk / meslek)
vex_last_human_bonus   150           // son insana verilen ekstra can
vex_nemesis_hp         9000          // nemesis taban cani (+500 / oyuncu)
vex_assassin_hp        6000          // assassin taban cani (+300 / oyuncu)
vex_survivor_hp        1200
vex_sniper_hp          900

// ---------------------------------------------------------------------
//  BOSS
// ---------------------------------------------------------------------
vex_boss_hp            6000          // boss taban cani (bossa gore x0.8 - x1.2)
vex_boss_hp_per_player 1500          // her canli insan icin eklenen can (oyuncu sayisina gore olcek)
vex_boss_final_mult    1.5           // son round FINAL BOSS can carpani
vex_boss_damage        75            // boss pence hasari (delilik fazinda x1.25)
vex_boss_ability_mult  1.0           // boss yetenek hasari carpani (0.5 = yarisi)

// ---------------------------------------------------------------------
//  HASARLAR
// ---------------------------------------------------------------------
vex_nemesis_damage     250           // survivor/sniper'a yarisi
vex_assassin_damage    200
vex_minion_damage      35            // boss yardimcilari
vex_zombie_damage      60            // enfeksiyon olmayan modlarda zombi vurusu
vex_damage_per_ap      500           // zombiye verilen kac hasar = 1 AP
vex_knockback          1             // 1 = mermiler zombileri geri iter
vex_armor_protect      1             // 1 = zirh bitmeden insan enfekte olmaz

// ---------------------------------------------------------------------
//  HIZ
// ---------------------------------------------------------------------
sv_maxspeed            900           // hiz eventleri icin sinir yukseltildi (onemli!)
vex_zombie_speed_mult  1.0           // tum zombi hizlari carpani
vex_human_speed_mult   1.0           // tum insan hizlari carpani
vex_speedrush_human    1.55          // Hiz Tutkusu: insan hiz carpani
vex_speedrush_zombie   1.45          // Hiz Tutkusu: zombi hiz carpani
vex_speedrush_fov      105           // Hiz Tutkusu: gorus acisi (90 = normal)

// ---------------------------------------------------------------------
//  EKONOMI / ODULLER
// ---------------------------------------------------------------------
vex_start_ap           20            // yeni oyuncunun baslangic AP'si
vex_kill_ap            2             // zombi oldurme AP
vex_infect_ap          3             // enfekte etme AP
vex_mvp_ap             10            // round MVP odulu
vex_mvp_vc             1
vex_quests             1             // 1 = her round herkese kucuk bir gorev
vex_evolve             3             // bir roundda kac enfeksiyonla ALFA ZOMBI olunur (0 = kapali)

// ---------------------------------------------------------------------
//  LAZER MAYINI  (V = +setlaser kur, C = +dellaser / radio3 sok)
// ---------------------------------------------------------------------
vex_lm_enable          1
vex_lm_boss            0             // 0 = boss roundlarinda lazer YOK
vex_lm_free            1             // her dogusta bedava lazer sayisi
vex_lm_cost            12            // AP fiyati (Engineer yarisi)
vex_lm_max             2             // ayni anda kurulu lazer (oyuncu)
vex_lm_max_vip         3             // VIP / ELITE
vex_lm_team_max        16            // tum takim toplam
vex_lm_health          450           // mayin cani
vex_lm_damage          55            // isina dokunan zombiye hasar (0.4 sn'de bir)
vex_lm_zombie_mult     3.0           // zombi pencesinin mayina carpani (nemesis/boss x2.5 daha)
vex_lm_beam_wear       18            // her zombi temasinda mayindan giden can

// ---------------------------------------------------------------------
//  BOMBA MODLARI (bomba elindeyken sag tik)
// ---------------------------------------------------------------------
vex_give_nades         "ab"          // doguste bedava bomba: a = ates, b = buz, c = isaret fisegi
vex_nade_modes         1             // 1 = carpma / sensor / lazer / gudumlu / parcali aktif
vex_nade_sensor_radius 150
vex_nade_laser_length  700
vex_nade_homing_radius 750
vex_nade_cluster       4             // parcali bombada kucuk patlama sayisi

// ---------------------------------------------------------------------
//  HAVA IKMALI / KARSILAMA
// ---------------------------------------------------------------------
vex_airdrop            1
vex_airdrop_every      70            // kac saniyede bir ikmal (Malzeme Dususu eventinde 20)
vex_motd               1             // 1 = Vexmira karsilama penceresi (configs/vexmira_motd_tr/en.html)
vex_join_messages      1             // baglaniyor / katildi / ayrildi mesajlari

// ---------------------------------------------------------------------
//  VIP / ILETISIM / OYLAMA
// ---------------------------------------------------------------------
vex_vip_contact        "discord.gg/vexmira"
vex_vote_every         4             // kac roundda bir otomatik mod / event oylamasi (0 = kapali)

// =====================================================================
//  ADMIN KONSOL KOMUTLARI
//    vex_mode  <0-9>              sonraki round modu
//       0 Infection  1 Multi  2 Nemesis  3 Assassin  4 Survivor
//       5 Sniper     6 Swarm  7 Plague   8 Armageddon 9 Boss
//    vex_boss  <0-8 | -1>         sonraki round BOSS ve hangi boss (-1 = rastgele)
//       0 Brute  1 Banshee  2 Overlord  3 Inferno  4 Reaper
//       5 Frostlord  6 Stormcaller  7 Hive Queen  8 Void
//    vex_event <0-18>             sonraki round eventi
//       1 Blood Moon  2 Fog  3 Speed Rush  4 Low Gravity  5 Double Damage
//       6 Dark Night  7 Plague Outbreak  8 Supply Drop  9 Berserk
//       10 Adrenaline 11 Meteor 12 Horde 13 Titan 14 Gold Rush
//       15 Vampire Night 16 Headhunter 17 Thunderstorm 18 Blackout
//    vex_give_ap <isim> <miktar>  (RCON yetkisi)
//    vex_give_vc <isim> <miktar>
//    vex_give_xp <isim> <miktar>
//
//  VIP YONETIMI (RCON yetkisi)
//    vex_vip_add <isim | #userid | STEAM_ID> <gun> <1=VIP 2=ELITE>
//    vex_vip_remove <isim | #userid | STEAM_ID>
//    vex_vip_list
//  Kalici VIP icin users.ini: "t" bayragi = VIP, "s" bayragi = ELITE
//  Oyun icinden: M menusu -> Admin Menusu (ADMIN_BAN "d" yetkisi)
// =====================================================================

// =====================================================================
//  OYUN KURALLARI - ReGameDLL ayarlari
// =====================================================================
mp_round_infinite "abcdefghijk"   // round bitisini tamamen Vexmira yonetir (sure, rehine, bomba...)
mp_roundover 3
mp_autoteambalance 0
mp_limitteams 0
mp_auto_join_team 0
mp_buytime 0
mp_buy_anywhere 0
mp_maxmoney 999999
mp_t_default_weapons_secondary ""
mp_ct_default_weapons_secondary ""
mp_t_default_weapons_primary ""
mp_ct_default_weapons_primary ""
mp_t_give_player_knife 1
mp_ct_give_player_knife 1
mp_free_armor 0
mp_weapons_allow_map_placed 0
mp_nadedrops 0
mp_weapondrop 1
mp_item_staytime 15
mp_falldamage 1
mp_respawn_immunitytime 0
mp_kill_filled_spawn 0
mp_show_scenarioicon 0
mp_scoreboard_showmoney 3
mp_knockback 0

// =====================================================================
//  SUNUCU AYARLARI
// =====================================================================
hostname "VEXMIRA | Zombie Plague | 9 Boss + Lazer + Events | EN/TR"
mp_freezetime 3
mp_roundtime 4
mp_round_restart_delay 5
mp_friendlyfire 0
mp_footsteps 1
mp_flashlight 1
mp_tkpunish 0
sv_alltalk 1
sv_allowdownload 1
sv_allowupload 0
// FastDL kullaniyorsan ac (ozel ses/model icin cok onerilir):
// sv_downloadurl "http://senin-fastdl-adresin/cstrike/"
// Ag (efektler cok oldugu icin yuksek tutuldu)
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 102
sv_minupdaterate 30
// Dil: oyuncu basina dil (Vexmira /dil komutu ile EN/TR)
amx_language "en"
amx_client_languages 1
