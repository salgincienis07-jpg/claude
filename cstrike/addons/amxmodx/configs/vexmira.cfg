//   - Oyun icinde degistirdikten sonra: amx_cvar ile tek tek veya
//     sunucu konsoluna  vex_reload  (ses / model / sprite degisiklikleri
//     HARITA DEGISINCE gecerli olur, oyuncular dosyalari indirir).
//   - Dosya bulunamazsa / satir hataliysa plugin varsayilan degeri kullanir,
//     hata nedeni addons/amxmodx/logs/ altina yazilir.
