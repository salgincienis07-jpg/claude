// =====================================================================
//  ADMIN KOMUTLARI (konsol)
//    vex_mode  <0-9>         sonraki round modu
//       0 Infection  1 Multi  2 Nemesis  3 Assassin  4 Survivor
//       5 Sniper     6 Swarm  7 Plague   8 Armageddon 9 Boss
//    vex_boss  <0-8 | -1>    sonraki round BOSS ve hangi boss (-1 = rastgele)
//       0 Brute 1 Banshee 2 Overlord 3 Inferno 4 Reaper 5 Frostlord
//       6 Stormcaller 7 Hive Queen 8 Void
//    vex_event <0-18>        sonraki round eventi
//       1 Blood Moon  2 Fog  3 Speed Rush  4 Low Gravity  5 Double Damage
//       6 Dark Night  7 Plague Outbreak  8 Supply Drop  9 Berserk
//       10 Adrenaline 11 Meteor 12 Horde 13 Titan 14 Gold Rush
//       15 Vampire Night 16 Headhunter 17 Thunderstorm 18 Blackout
//    vex_reload               bu dosyayi yeniden yukler (RCON)
//    vex_give_ap / vex_give_vc / vex_give_xp <isim> <miktar>   (RCON)
//    vex_vip_add <isim | #userid | "STEAM_ID"> <gun> <1=VIP 2=ELITE>
//    vex_vip_remove <isim | #userid | "STEAM_ID">   |   vex_vip_list
//  Oyun icinden: M -> Admin Menusu (ADMIN_BAN "d" yetkisi): tum modlar,
//  eventler, bosslar (hemen / sonraki round), hava durumu, ikmal, lazer
//  ac/kapa, round bitir, oyuncu islemleri, ayarlari yenile...
// =====================================================================
