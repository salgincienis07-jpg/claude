//   - Sunucu adi, oyun kurallari, tum canlar / hasarlar / hizlar,
//     AP - XP - VC odulleri, esya fiyatlari / limitleri / levelleri /
//     degerleri, zombi siniflari, ozel silahlar, silahlar, meslekler,
//     bosslar ve 27 boss [R] yetenegi, hava durumu / isik / sis,
//     tum SESLER / MODELLER / SPRITE'LAR: HEPSI BU DOSYADA.
