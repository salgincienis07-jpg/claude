vex_mode_rule 4  5    2   // Survivor
vex_mode_rule 5  4    2   // Sniper
vex_mode_rule 6  5    2   // Swarm
vex_mode_rule 7  3    2   // Plague
vex_mode_rule 8  2    2   // Armageddon
vex_mode_rule 9  0    2   // BOSS

