                                  // her oyuncunun modelinden otomatik okunur (studio basligi / idle1;
                                  // comelince crouch_idle) - uzun bosslarda bar kendiliginden yukselir
vex_overhead_gap          2       // ust uste gostergeler (bar -> boss amblemi -> ikon) arasi bosluk (birim)
vex_hpbar_width           44      // kucuk barin genisligi (Nemesis / Assassin / Alfa)
vex_head_icon_size        18      // kafa ustu ikon boyutu (birim)
