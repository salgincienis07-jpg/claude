[radio]              ; <key> = <sec> <EN wav> <TR wav> <EN subtitle> | <TR subtitle>  (sound/vexmira/radio/; -sec = low priority)
                     ; key = [messages] key, ev_<event>, lock, or a vexcmd_radio_<key> relay
ev_freeze_end = 4.7 cd_ev_freeze_end_en.wav cd_ev_freeze_end_tr.wav Cordon Command: All survivors, restore power at the substation. Move out! | Kordon Komuta: Tum sag kalanlar, trafo merkezinde elektrigi verin. Harekete gecin!
brk_half = 3.2 cd_brk_half_en.wav cd_brk_half_tr.wav Field Unit: Breaker one is down. Throw the second breaker, now! | Saha Birimi: Birinci salter indi. Hemen ikinci salteri indirin!
power = 3.7 cd_power_en.wav cd_power_tr.wav Cordon Command: Power is back on the grid. Now lower the lift bridge! | Kordon Komuta: Elektrik geri geldi. Simdi kaldirma koprusunu indirin!
bridge = 3.6 cd_bridge_en.wav cd_bridge_tr.wav Cordon Command: Bridge is down, harbor road is open. Get to the tower roof! | Kordon Komuta: Kopru indi, liman yolu acik. Kule catisina cikin!
beacon = 3.6 cd_beacon_en.wav cd_beacon_tr.wav Cordon Command: Beacon is lit! Medevac is on the way. Hold that roof! | Kordon Komuta: Isaret yandi! Helikopter yolda. Catiyi tutun!
heli_in = 4.2 cd_heli_in_en.wav cd_heli_in_tr.wav Angel One: Cordon, Angel One. I have your beacon, inbound now! | Melek Bir: Kordon, burasi Melek Bir. Isaretinizi goruyorum, geliyoruz!
heli_clear = 3.3 cd_heli_clear_en.wav cd_heli_clear_tr.wav Angel One: Clear the pad! Clear the pad! Touching down! | Melek Bir: Pisti bosaltin! Pisti bosaltin! Iniyoruz!
heli = 3.0 cd_heli_en.wav cd_heli_tr.wav Angel One: Angel One on the deck! Get aboard, fifteen seconds! | Melek Bir: Melek Bir indi! Binin, on bes saniye!
heli_go = 2.6 cd_heli_go_en.wav cd_heli_go_tr.wav Angel One: Lifting off! Hold on tight back there! | Melek Bir: Kalkiyoruz! Arkada siki tutunun!
lock = 3.8 cd_lock_en.wav cd_lock_tr.wav Cordon Command: Negative, no power there. Finish the previous objective. | Kordon Komuta: Olumsuz, orada guc yok. Once onceki gorevi bitirin.
breach = 4.3 cd_breach_en.wav cd_breach_tr.wav Emergency Net: Contact! The evac train is breached! Infected in the station! | Acil Durum Agi: Temas! Tahliye treni patladi! Istasyonda enfekteliler var!
boss = 4.1 cd_boss_en.wav cd_boss_tr.wav Emergency Net: All units, massive hostile in the plaza. Do not engage alone! | Acil Durum Agi: Tum birimler, meydanda dev bir dusman. Yalniz catismayin!
ev_boss_dead = 2.5 cd_ev_boss_dead_en.wav cd_ev_boss_dead_tr.wav Cordon Command: The big one is down! Outstanding work! | Kordon Komuta: Dev olan dustu! Harika is!
ev_lasthuman = 4.3 cd_ev_lasthuman_en.wav cd_ev_lasthuman_tr.wav Cordon Command: You are the last one out there. Survive, at all costs! | Kordon Komuta: Disarida tek sen kaldin. Ne pahasina olursa olsun hayatta kal!
ev_minute = 3.4 cd_ev_minute_en.wav cd_ev_minute_tr.wav Emergency Net: Incoming artillery! Shells inbound, take cover! | Acil Durum Agi: Topcu atesi! Mermiler geliyor, siper alin!
blackout = 4.1 cd_blackout_en.wav cd_blackout_tr.wav Emergency Net: Grid failure! We lost power, emergency lights only! | Acil Durum Agi: Sebeke coktu! Elektrik gitti, sadece acil isiklar!
barricade = 2.8 cd_barricade_en.wav cd_barricade_tr.wav Emergency Net: The tower barricade is down! They are inside! | Acil Durum Agi: Kule barikati yikildi! Icerideler!
scare = -2.9 cd_scare_en.wav cd_scare_tr.wav Field Unit: What was that? Something is moving out there... | Saha Birimi: O da neydi? Disarida bir sey hareket ediyor...
supply = -2.9 cd_supply_en.wav cd_supply_tr.wav Field Unit: Supplies found. Grab the ammo and keep moving. | Saha Birimi: Erzak bulundu. Mermileri alin ve ilerleyin.
ev_win_humans = 4.1 cd_ev_win_humans_en.wav cd_ev_win_humans_tr.wav Cordon Command: Evac complete. Cordon Seven, you made it. Command out. | Kordon Komuta: Tahliye tamam. Kordon Yedi, basardiniz. Komuta tamam.
ev_win_zombies = 3.8 cd_ev_win_zombies_en.wav cd_ev_win_zombies_tr.wav Cordon Command: We have lost Cordon Seven. All units, fall back... | Kordon Komuta: Kordon Yedi'yi kaybettik. Tum birimler, geri cekilin...

[chatter]            ; random radio chatter while the round is live (vex_map_chatter = average gap in s, 0 = off)
ch_gate = 3.8 cd_ch_gate_en.wav cd_ch_gate_tr.wav Field Unit: Gate Seven to any unit. Does anyone copy? Over. | Saha Birimi: Kapi Yedi'den tum birimlere. Beni duyan var mi? Tamam.
ch_patrol = 4.0 cd_ch_patrol_en.wav cd_ch_patrol_tr.wav Field Unit: Patrol Two, we lost the east checkpoint. They are everywhere! | Saha Birimi: Devriye Iki, dogu kontrol noktasini kaybettik. Her yerdeler!
ch_wall = 3.3 cd_ch_wall_en.wav cd_ch_wall_tr.wav Cordon Command: Quarantine is in effect. Nobody crosses the wall. | Kordon Komuta: Karantina yururlukte. Kimse duvari gecemez.
ch_medic = 3.5 cd_ch_medic_en.wav cd_ch_medic_tr.wav Emergency Net: Medical team, we need stretchers at the field hospital! | Acil Durum Agi: Saglik ekibi, sahra hastanesine sedye lazim!
